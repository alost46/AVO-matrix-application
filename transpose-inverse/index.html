<!doctype html>
<html lang="ru">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Транспонированная и обратная матрицы · 01b</title>
<link rel="stylesheet" href="../avo-core/v1/core.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<link rel="icon" type="image/png" sizes="32x32" href="https://alost46.github.io/AVO-matrix-application/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://alost46.github.io/AVO-matrix-application/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVO Matrices">
<meta name="theme-color" content="#f4f8fc">
<style>
/* Navigation only. Geometry and AVO Core remain unchanged. */
.avo-home-link{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 11px;border:1px solid #b9ccda;border-radius:8px;background:#fff;color:#235a87;font:700 14px system-ui,'Segoe UI',Arial,sans-serif;text-decoration:none;white-space:nowrap}
.avo-home-link:hover{background:#e7f4fd}
.avo-home-link:focus-visible{outline:3px solid #579bd0;outline-offset:2px}
</style>
</head>
<body>
<script src="../avo-core/v1/messages.js"></script>
<script src="../avo-core/v1/ui.js"></script>
<script src="../avo-core/v1/core.js"></script>
<script src="./model.js"></script>
<script>
 // Presentation-only version update; the mathematical model is not changed.
 AVOTransposeInverse.version='01b · Core 1.0';
 for(const [code,label] of Object.entries({ru:'Веб-версия 01b',en:'Web version 01b',he:'גרסת רשת 01b'})){
   AVOTransposeInverse.messages[code].edition=label;
 }
 document.body.insertAdjacentHTML('afterbegin', AVOCoreUI(AVOTransposeInverse));
 // Insert a genuine link in the existing header, without replacing its flag buttons.
 const nav=document.querySelector('.shell header .top-actions');
 if(nav){
   const home=document.createElement('a');
   home.id='avo-home-link';home.className='avo-home-link';home.href='../?lang=ru';
   home.textContent='⌂ На главную';home.setAttribute('aria-label','На главную');
   nav.prepend(home);
 }
 // Language explicitly chosen on the home page takes precedence over a locally saved app language.
 const AVOHubLanguage=(()=>{
   const valid=v=>['ru','en','he'].includes(v)?v:null;
   try{
     const q=valid(new URLSearchParams(location.search).get('lang'));
     return q||valid(localStorage.getItem('avo-site-language'))||valid(localStorage.getItem('avo-home-lang'));
   }catch(_){return null;}
 })();
 function AVOSetHubLanguage(next){
   if(!['ru','en','he'].includes(next))next='ru';
   try{localStorage.setItem('avo-site-language',next);localStorage.setItem('avo-home-lang',next);}catch(_){}
   const h=document.getElementById('avo-home-link');
   if(h){const labels={ru:'На главную',en:'Home',he:'לדף הראשי'};
     h.textContent='⌂ '+labels[next];h.setAttribute('aria-label',labels[next]);
     h.href='../?lang='+encodeURIComponent(next);
   }
 }
 // Shared with the module script below. The event handler itself is attached after core startup.
 window.AVOHubNavigation={preferred:AVOHubLanguage,update:AVOSetHubLanguage};

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
try {
 window.AVOInstance=AVOCore.start({...AVOTransposeInverse,THREE,OrbitControls});
 // AVOCore.start() has restored its saved state. Now honor the home-page selection.
 if(window.AVOHubNavigation.preferred){
   window.AVOInstance.setLanguage(window.AVOHubNavigation.preferred);
 }
 window.AVOHubNavigation.update(document.documentElement.lang);
 for(const btn of document.querySelectorAll('.shell header .top-actions [data-lang]')){
   btn.addEventListener('click',()=>window.AVOHubNavigation.update(btn.dataset.lang));
 }
 document.getElementById('avo-home-link')?.addEventListener('click',()=>{
   const current=document.documentElement.lang;
   window.AVOHubNavigation.update(current);
   // Snapshot before leaving, rather than waiting for a deferred auto-save.
   try{localStorage.setItem(AVOTransposeInverse.stateKey,JSON.stringify(window.AVOInstance.getState()));}catch(_){}
 });
} catch(err) {
 window.AVOStartupError=true;
 console.error('AVO Core start failed:',err);
 const msg='Ошибка запуска графиков: '+(err?.message||String(err));
 for(const id of ['a','b','ba']){
   const el=document.getElementById('status-'+id);
   if(el)el.textContent=msg;
 }
}
</script>
<script>
// Report missing modules only when application startup did not execute.
setTimeout(()=>{
 if(window.AVOInstance || window.AVOStartupError)return;
 const errors={ru:'Графические модули не запустились. Проверьте соединение и обновите страницу.',en:'Three.js could not load. Check your internet connection and refresh the page.',he:'טעינת Three.js נכשלה. בדקו את החיבור לאינטרנט ורעננו את הדף.'};
 const labels=['Загрузка…','Loading…','טוען…'];
 for(const id of ['a','b','ba']){
  const el=document.getElementById('status-'+id);
  if(el && labels.includes(el.textContent.trim()))el.textContent=errors[document.documentElement.lang]||errors.ru;
 }
},9000);
</script>
</body>
</html>
