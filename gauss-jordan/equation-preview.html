<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Проверка оформления уравнений · 01ad</title><link rel="stylesheet" href="equation-layout.css"><style>
*{box-sizing:border-box}body{font:17px system-ui,'Segoe UI',sans-serif;color:#153b58;background:#eef3f8;margin:0;padding:22px}h1{font-size:23px;margin:0 0 10px}.note{margin:0 0 18px}.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panel{border:1px solid #cddbe7;border-radius:8px;background:white;min-width:0}.panel h2{margin:0;padding:12px;background:#e4edf7;font-size:18px}.matwrap{padding-top:30px;padding-bottom:30px}.matrix input{border:1px solid #bbc}.equation-guide{font-size:14px;color:#577; padding:0 12px 14px}@media(max-width:1050px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.panels{grid-template-columns:1fr}}</style></head><body><h1>Проверка читаемости уравнений · 01ad</h1><p class="note">Простые жирные строки уравнений без таблицы и выравнивания по разрядам. Математика приложения здесь не используется.</p><div class="panels" id="panels"></div><script src="equation-layout.js"></script><script>
const rows=[[[2,1,-1,8],[-3,-1,2,-11],[-2,1,2,-3]],[[1,1/3,-2/3,11/3],[0,1/3,1/3,2/3],[0,5/3,2/3,13/3]],[[1,0,-.8,2.8],[0,1,.4,2.6],[0,0,.2,-.2]],[[1,0,0,2],[0,1,0,3],[0,0,1,-1]]];
const root=document.getElementById('panels');
rows.forEach((matrix,idx)=>{let p=document.createElement('section');p.className='panel';
 const cell=(v,i)=>`<td class="matrix-number ${i===3?'matrix-rhs':''}">${idx===0?`<input readonly value="${Number(v)}">`:Number(v).toFixed(2)}</td>`;
 const table=matrix.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('');
 p.innerHTML=`<h2>${idx?'Шаг '+idx:'Исходная система'}</h2><div class="matwrap"><div class="matpair"><table class="matrix"><tbody>${table}</tbody></table><div class="avoe-grid"></div></div></div><div class="equation-guide">Простые строки, жирный шрифт</div>`;
 root.append(p);AVOEquationLayout.render(p.querySelector('.avoe-grid'),matrix);});
</script></body></html>
