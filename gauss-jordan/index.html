/* AVO shared language navigation, pilot 02. Uses the application's public language buttons. */
(()=>{
  'use strict';
  const VALID=['ru','en','he'];
  const LABELS={ru:'На главную',en:'Home',he:'לדף הראשי'};
  const KEY='avo-site-language',OLD='avo-home-lang';
  const home=document.getElementById('avo-return-home');
  const safeGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const query=new URLSearchParams(location.search).get('lang');
  const preferred=VALID.includes(query)?query:(safeGet(KEY)||safeGet(OLD)||'ru');
  function sync(lang){
    if(!VALID.includes(lang))return;
    try{localStorage.setItem(KEY,lang);localStorage.setItem(OLD,lang)}catch(e){}
    const url=new URL('../',location.href);url.searchParams.set('lang',lang);
    home.href=url.href;home.textContent='⌂ '+LABELS[lang];
  }
  // Persist user selection before the application's own language handler executes.
  document.addEventListener('click',event=>{
    const flag=event.target.closest?.('[data-lang]');
    if(flag&&VALID.includes(flag.dataset.lang))sync(flag.dataset.lang);
  },true);
  home.addEventListener('click',()=>sync(document.documentElement.lang));
  let initialized=false;
  function applyWhenReady(){
    if(initialized)return true;
    // Gauss core imports Three.js asynchronously, then builds four card matrices.
    // Only apply preferred language AFTER core has built UI and restored saved state.
    if(!document.querySelector('#mat0 tr') || !document.querySelector('.panel'))return false;
    initialized=true;
    const flag=document.querySelector('[data-lang="'+preferred+'"]');
    if(flag)flag.click();
    sync(VALID.includes(document.documentElement.lang)?document.documentElement.lang:preferred);
    return true;
  }
  sync(preferred);
  if(!applyWhenReady()){
    const root=document.getElementById('cards');
    if(root){
      const observer=new MutationObserver(()=>{if(applyWhenReady())observer.disconnect()});
      observer.observe(root,{childList:true,subtree:true});
    }
  }
  // Language can change through JSON state restoration as well as the flag buttons.
  new MutationObserver(()=>{
    if(initialized)sync(document.documentElement.lang);
  }).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();
</script></body></html>
