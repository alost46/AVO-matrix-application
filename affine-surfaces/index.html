<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><title>AVO · Аффинные преобразования поверхностей · 01q</title>
<link rel="stylesheet" href="../avo-core/v2/core.css?core=01m"><link rel="stylesheet" href="./surface.css?v=01q">
<link rel="stylesheet" href="../avo-camera/v1/camera.css?v=01a">

<link rel="icon" href="../favicon-32.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head>
<body><div id="app"><noscript>Для работы нужен JavaScript.</noscript></div>
<script type="module">
import {createApp} from '../avo-core/v2/app.js?core=01m';
import {initialInputs,mathModel,picturesForLayout,MSG} from './math.js?v=01q';
import {SurfaceRenderer} from './render.js?v=01q';
import {installControls} from './controls.js?v=01q';
import {installCamera} from '../avo-camera/v1/camera.js?v=01a';
// Compatible extension of 01i state: old JSON and saved inputs omitted time keys.
const extendInputs = data => {
 if(!data||typeof data!=='object'||Array.isArray(data))return;
 for(const key of Object.keys(initialInputs))if(!Object.hasOwn(data,key))
  data[key]=structuredClone(initialInputs[key]);
};
const stateKey='avo-core-v2:affine-surfaces-01f:state-v2';
try{
 const old=localStorage.getItem(stateKey);
 if(old){const state=JSON.parse(old);extendInputs(state.initialInputs);extendInputs(state.inputs);localStorage.setItem(stateKey,JSON.stringify(state));}
}catch(error){console.warn('Cannot migrate previously saved inputs',error);}
try{
 const app=createApp({appId:'affine-surfaces-01f',mountId:'app',initialInputs,mathModel,messages:MSG,picturesForLayout,layoutOptions:[3]});
 // Application-specific atomic Reset A: identity A AND zero displacement T.
 // The Core implementation and the generic Picture are not modified.
 app.resetMatrix=(name)=>{
  if(name!=='A')return;
  app.applyChange(()=>{
   app.matrixFactory.resetMatrix('A');
   app.syncMatrices();
   app.currentData.t=[0,0,0];
  });
 };
 const validateSaved=app.validateSaved.bind(app);
 app.validateSaved=state=>{extendInputs(state?.initialInputs);extendInputs(state?.inputs);return validateSaved(state);};
 const controls=installControls(app);
 const painter=new SurfaceRenderer(app,progress=>controls.report(progress));
 const compute=app.compute.bind(app);
 app.compute=()=>{compute();controls.sync();controls.refreshAnnotations?.();painter.start();};
 const setLanguage=app.setLanguage.bind(app);
 app.setLanguage=lang=>{setLanguage(lang);controls.localize();};
 app.startSurface=()=>painter.start();
 controls.refreshAnnotations?.();
 painter.start();window.AVOSurfaces=app;
 const adapter={async captureFrames({mode,to,step,onFrame,cancelled}){
  if(mode==='t'){
   if(app.currentInputs().shape!=='time')throw Error('Для t выберите форму «С параметром t» / Choose time-dependent surface mode');
   const {parameterValues}=await import('./math.js?v=01q');
   if(parameterValues(app.currentInputs()).length>240)throw Error('Для записи уменьшите число шагов t до 240 / At most 240 frames');
   painter.cameraStep=async info=>{if(cancelled())throw Error('AVO_CAMERA_CANCELLED');await onFrame(info);};
   try{await painter.start();if(painter.lastError)throw painter.lastError;}
   finally{painter.cameraStep=null;}
  }else{
   const idx={tx:0,ty:1,tz:2}[mode];if(idx===undefined)throw Error('Unknown animation parameter');
   const original=app.currentData.t.slice();const from=original[idx];
   const n=Math.ceil(Math.abs(to-from)/step);
   if(n>239)throw Error('Слишком много кадров: максимум 240 / Max 240 frames');
   try{
    for(let i=0;i<=n;i++){
     if(cancelled())throw Error('AVO_CAMERA_CANCELLED');
     const v=i===n?to:from+Math.sign(to-from)*Math.min(i*step,Math.abs(to-from));
     app.currentData.t[idx]=v;
     controls.sync();controls.refreshAnnotations?.();
     await painter.start();if(painter.lastError)throw painter.lastError;
     if(cancelled())throw Error('AVO_CAMERA_CANCELLED');
     await onFrame({index:i,total:n+1,time:v});
    }
   }finally{
    app.currentData.t=original;
    controls.sync();controls.refreshAnnotations?.();
    await painter.start();
   }
  }
 }};
 // AVO Camera 01a is unchanged. App 01q only relocates its existing panel.
 // Put the camera control AFTER the right-hand result picture description.
 // No change to the generic Camera module or Core v2 presentation.
 const outputPicture=app.pictures.get('output');
 if(!outputPicture?.endInfo)throw Error('Output picture is unavailable for camera mounting');
 const panelMount=document.createElement('div');
 panelMount.className='surface-camera-panel';
 outputPicture.endInfo.insertAdjacentElement('afterend',panelMount);
 const cameraButton=document.createElement('button');
 cameraButton.className='surface-camera-button';
 cameraButton.type='button';
 cameraButton.setAttribute('aria-controls','avo-camera');
 cameraButton.setAttribute('aria-expanded','false');
 panelMount.append(cameraButton);
 const camera=installCamera({app,adapter,mount:panelMount});
 camera.root.hidden=true;
 const cameraLabels={ru:'🎥 Кинокамера',en:'🎥 Camera',he:'🎥 מצלמה'};
 const updateCameraButton=()=>{
  cameraButton.textContent=cameraLabels[app.lang]||cameraLabels.ru;
  cameraButton.setAttribute('aria-expanded',String(!camera.root.hidden));
  cameraButton.classList.toggle('active',!camera.root.hidden);
 };
 cameraButton.addEventListener('click',()=>{
  camera.root.hidden=!camera.root.hidden;
  updateCameraButton();
 });
 updateCameraButton();
 const oldLanguage=app.setLanguage.bind(app);
 app.setLanguage=lang=>{oldLanguage(lang);camera.localize();updateCameraButton();};
 window.AVOCamera=camera;

}catch(error){console.error(error);const p=document.createElement('p');p.className='error';p.textContent='AVO 01q: '+error.message;document.getElementById('app').append(p);}
</script></body></html>
