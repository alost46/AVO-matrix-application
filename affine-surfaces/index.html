<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><title>AVO · Аффинные преобразования поверхностей · 01j</title>
<link rel="stylesheet" href="../avo-core/v2/core.css?core=01m"><link rel="stylesheet" href="./surface.css?v=01j">
<link rel="icon" href="../favicon-32.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head>
<body><div id="app"><noscript>Для работы нужен JavaScript.</noscript></div>
<script type="module">
import {createApp} from '../avo-core/v2/app.js?core=01m';
import {initialInputs,mathModel,picturesForLayout,MSG} from './math.js?v=01j';
import {SurfaceRenderer} from './render.js?v=01j';
import {installControls} from './controls.js?v=01j';
// Compatible extension of 01i state: old JSON and saved inputs omitted time keys.
const extendInputs = data => {
 if(!data||typeof data!=='object'||Array.isArray(data))return;
 for(const key of Object.keys(initialInputs))if(!Object.hasOwn(data,key))
  data[key]=structuredClone(initialInputs[key]);
};
const stateKey='avo-core-v2:affine-surfaces-01f:state-v2';
try{
 const old=localStorage.getItem(stateKey);
 if(old){const state=JSON.parse(old);extendInputs(state.initialInputs);extendInputs(state.inputs);localStorage.setItem(stateKey,JSON.stringify(state));}
}catch(error){console.warn('Cannot migrate previously saved inputs',error);}
try{
 const app=createApp({appId:'affine-surfaces-01f',mountId:'app',initialInputs,mathModel,messages:MSG,picturesForLayout,layoutOptions:[3]});
 const validateSaved=app.validateSaved.bind(app);
 app.validateSaved=state=>{extendInputs(state?.initialInputs);extendInputs(state?.inputs);return validateSaved(state);};
 const controls=installControls(app);
 const painter=new SurfaceRenderer(app,progress=>controls.report(progress));
 const compute=app.compute.bind(app);
 app.compute=()=>{compute();controls.sync();controls.refreshAnnotations?.();painter.start();};
 const setLanguage=app.setLanguage.bind(app);
 app.setLanguage=lang=>{setLanguage(lang);controls.localize();};
 app.startSurface=()=>painter.start();
 controls.refreshAnnotations?.();
 painter.start();window.AVOSurfaces=app;
}catch(error){console.error(error);const p=document.createElement('p');p.className='error';p.textContent='AVO 01j: '+error.message;document.getElementById('app').append(p);}
</script></body></html>
